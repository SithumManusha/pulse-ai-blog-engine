name: pulse-ai-blog-engine
region: nyc
services:
  - name: web
    dockerfile_path: Dockerfile
    source_dir: /
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: DB_CONNECTION
        value: sqlite
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
